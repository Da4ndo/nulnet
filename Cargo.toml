[package]
name = "nulnet"
version = "1.4.0"
edition = "2024"

[dependencies]
ed25519-dalek = "3.0.0"
getrandom = "0.4.3"
hex = "0.4.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
sysinfo = "0.39.6" # NEW GPU API 0.40.0
tokio = { version = "1.54.1", features = ["rt", "rt-multi-thread", "macros", "fs", "time", "net", "io-util", "process", "sync", "signal"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
